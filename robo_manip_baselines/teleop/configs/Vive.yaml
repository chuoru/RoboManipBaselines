# serial_number is the TRACKER's stable hardware serial (starts with "LHR-"),
# NOT the lighthouse's serial (starts with "LHB-"). Run
# `python ./teleop/check_vive_devices.py` to find your tracker's serial.
device_params:
  name: primary
  serial_number: LHR-904A2704
# pos_scale and the rotation matrices below are copied as-is from ViveDual.yaml's
# left-arm (index 0) calibration, as a starting point only. The dual rig's left/right
# arms are mounted facing each other, so a single-arm mount will generally have a
# different room-to-base orientation -- re-run teleop/calibrate_vive_axes.py and
# teleop/calibrate_vive_world_frame.py against the actual single-arm setup before
# trusting the motion directions.
pos_scale: 0.9
vive_to_eef_frame_rotation:
  - [-0.017408, -0.038467, -0.999108]
  - [-0.998416, 0.054132, 0.015312]
  - [0.053495, 0.997793, -0.039348]
vive_world_to_base_frame_rotation:
  - [0.234888, -0.889556, -0.391813]
  - [0.166570, -0.360291, 0.917848]
  - [-0.957644, -0.280856, 0.063545]
