# Demo collection for the "grasp" segment of CupPickPlace (doc/segment_data_collection.md).
#
#   python ./bin/Teleop.py RealFairino5Demo \
#     --config ./envs/configs/RealFairino5DemoEnv_SpaceMouse.yaml \
#     --input_device spacemouse --input_device_config ./teleop/configs/SpaceMouseRealFairino5.yaml \
#     --pre_segments ./envs/configs/segments/collect_grasp.yaml \
#     --pedal_config ./common/configs/pedal_default.yaml \
#     --demo_name CupPickPlace_grasp_SM_iter000
#
# Each demo: (reset pose) -> home -> [operator: approach the cup and close
# the gripper, then INTERVENE ('n') right away] -> SUCCESS saves / FAIL
# discards -> [unrecorded teleop: carry the cup somewhere else on the table
# and open the gripper, then INTERVENE] -> the gripper opens and the arm
# retreats upward -> home for the next demo.
segment: grasp
poses: ../poses/CupPickPlace.yaml
# Same start pose as the grasp segment in CupPickPlace.yaml.
pre_segments:
  - {joint_pos: home}
# After saving/discarding: let go of the cup and move up before the next
# reset moves the arm back home (moving home with the fingers around the cup
# would drag it along).
post_segments:
  - {gripper: open}
  - {rel_xyz: [0, 0, 0.08]}
# Move the cup with the arm between demos, for varied start positions
# without walking up to the table (TeleopBase RearrangeTeleopPhase).
rearrange_after_demo: true
# The demo is finished by hand (INTERVENE), not when the gripper closes:
# auto_finish_on: gripper_closed would cut the demo at the first close,
# which the operator may want to redo. Finish right after closing, so the
# demos end where the segment runner ends the grasp segment.
