# Exhibition task: grasp a cup placed anywhere on the table (learned), carry
# it (scripted), put it on the coaster a visitor placed (learned), repeat.
# The cup ends up where the next cycle grasps it from, so the cycle runs
# without anyone resetting the scene.
#
#   python ./bin/RolloutSegments.py RealFairino5Demo \
#     --config ./envs/configs/RealFairino5DemoEnv_SpaceMouse.yaml \
#     --task ./envs/configs/segments/CupPickPlace.yaml [--mode exhibit]
#
# Segment types:
#   scripted_move  joint_pos: <named pose>  (blocking MoveJ, vel = MoveJ %)
#                  rel_xyz: [dx, dy, dz]    (relative to the current pose, base frame [m])
#   gripper        gripper: open | close
#   learned        a policy (or, with --replace_learned_with_teleop, the SpaceMouse)
#                  runs until `done` holds for done_ticks loops
#                    done: gripper_closed_for_ticks | gripper_opened_for_ticks | success_pedal
#                    timeout_s: policy time before the attempt counts as failed
#                    max_retries: retries before stopping for the operator
#                    on_fail: scripted steps that bring the arm back to the
#                             segment's start pose before a retry
#                    checkpoint: policy_best.ckpt (model_meta_info.pkl next to it)
#                    check: grasp_check | released_check  (finger AprilTags, after `done`)
#                    check_undetected: pass | fail | defer  (tags not visible;
#                      defer = pass now, a later check decides)
#   check          a check on its own between scripted segments (check:,
#                  undetected:, fail_reason:); a failure retries the learned
#                  segment before it (its on_fail first)
#
# Every learned segment must start from the same pose every time (the
# scripted segment before it) and should be followed by a relative retreat:
# where it ends differs every time.
task_name: CupPickPlace
poses: ../poses/CupPickPlace.yaml
# Finger AprilTag detection (handed to the env) and check thresholds.
gripper_marker: ../gripper_marker/CupPickPlace.yaml
# Loop period [s] = one policy step; the policies are trained on data
# resampled to the same rate (misc/ResampleRmbData.py --target_hz 5).
control_period: 0.2

segments:
  - {name: go_home, type: scripted_move, joint_pos: home}
  - name: grasp
    type: learned
    checkpoint: ../../../checkpoint/DiffusionPolicy/CupPickPlace_grasp_iter000/policy_best.ckpt
    done: gripper_closed_for_ticks
    done_ticks: 5
    # Fingers stopped by the cup? Hidden tags (cup in front of them on the
    # table) are decided again by lift_check.
    check: grasp_check
    check_undetected: defer
    # Roughly 2-3x the average grasp demo; time under human control does not count.
    timeout_s: 30
    max_retries: 2
    on_fail: [{gripper: open}, {rel_xyz: [0, 0, 0.08]}, {joint_pos: home}]
  - {name: lift, type: scripted_move, rel_xyz: [0, 0, 0.10]}
  # Still holding it after lifting? (empty -> "dropped"; tags still hidden -> failure)
  - {name: lift_check, type: check, check: grasp_check, undetected: fail, fail_reason: dropped}
  - {name: go_carry, type: scripted_move, joint_pos: carry}
  - name: place
    type: learned
    checkpoint: ../../../checkpoint/DiffusionPolicy/CupPickPlace_place_iter000/policy_best.ckpt
    done: gripper_opened_for_ticks
    done_ticks: 5
    # Did the fingers really open (not only the command)?
    check: released_check
    check_undetected: pass
    timeout_s: 30
    max_retries: 2
    # Keep holding the cup: do not open the gripper on a failed place.
    on_fail: [{rel_xyz: [0, 0, 0.08]}, {joint_pos: carry}]
  - {name: retreat, type: scripted_move, rel_xyz: [0, 0, 0.08]}
  - {name: back_home, type: scripted_move, joint_pos: home}

# After a stop (max_retries exceeded), the operator fixes the scene and
# presses SUCCESS; these steps run before the cycle restarts from go_home.
# Opening the gripper first releases the cup the operator is holding after a
# failed place (and is harmless after a failed grasp, where it is open).
on_operator_resume:
  - {gripper: open}
