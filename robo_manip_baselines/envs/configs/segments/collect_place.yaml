# Demo collection for the "place" segment of CupPickPlace
# (doc/segment_data_collection.md).
#
#   python ./bin/Teleop.py RealFairino5Demo \
#     --config ./envs/configs/RealFairino5DemoEnv_SpaceMouse.yaml \
#     --input_device spacemouse --input_device_config ./teleop/configs/SpaceMouseRealFairino5.yaml \
#     --pre_segments ./envs/configs/segments/collect_place.yaml \
#     --pedal_config ./common/configs/pedal_default.yaml \
#     --demo_name CupPickPlace_place_SM_iter000
#
# Each demo: (reset pose) -> home -> [unrecorded: grasp the cup wherever it
# is and lift it, then INTERVENE] -> up -> carry -> [operator: put the cup
# on the coaster and open the gripper, then INTERVENE ('n') right away] ->
# SUCCESS saves / FAIL discards -> [unrecorded: push the coaster (with the
# cup on it) somewhere else, then INTERVENE] -> retreat up.
#
# The cup is picked up by hand (SpaceMouse) rather than by a script from a
# fixture: no fixture or fixture poses are needed, and the way the cup sits
# in the gripper varies a little from demo to demo -- as it will in the
# real task, where the learned grasp segment picks the cup up.
segment: place
poses: ../poses/CupPickPlace.yaml
pre_segments:
  - {joint_pos: home}
  - {teleop: "grasp the cup and lift it"}
  # Clearance above the table before the joint move to carry.
  - {rel_xyz: [0, 0, 0.05]}
  # Same start pose as the place segment in CupPickPlace.yaml.
  - {joint_pos: carry}
post_segments:
  - {teleop: "push the coaster to a new place"}
  - {rel_xyz: [0, 0, 0.08]}
# Finished by hand (INTERVENE) right after opening, not by
# auto_finish_on: gripper_opened.
