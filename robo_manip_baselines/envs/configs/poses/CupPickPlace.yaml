# Named arm poses of the CupPickPlace task (envs/configs/segments/CupPickPlace.yaml
# and collect_*.yaml), as the 6 FR5 joint angles.
#
# Record each pose on the real arm with
#   python ./misc/RecordNamedPose.py --config ./envs/configs/RealFairino5DemoEnv_SpaceMouse.yaml \
#       --poses_file ./envs/configs/poses/CupPickPlace.yaml --names home carry
# A pose left as null makes the segment runner and the demo collection
# refuse to start if they use it (on purpose: a guessed pose can drive the
# arm into the table).
#
#   home          start pose of the grasp segment: camera looking down at the
#                 whole area where the cup can be
#   carry         start pose of the place segment: cup held, camera looking
#                 down at the whole area where the coaster can be
unit: deg
poses:
  # "init" = the env's reset pose (RealFairino5DemoEnv.READY_POSE_DEG).
  # Replace with a recorded pose once the camera view is decided.
  home: init
  carry: null
