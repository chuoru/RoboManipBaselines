%YAML:1.0

# ORB-SLAM3 settings for the Insta360 X3/X4 Sphere-mode live stream, cropped
# to a single lens (see main.cc's slam_frame crop, --lens front|back).
# Camera1.fx/fy/cx/cy/k1-k4 and IMU.T_b_c1 below are from a real Basalt
# camera-IMU calibration (KannalaBrandt8/kb4, AprilGrid target, 22mm tags) --
# see envs/real/insta360_bridge/README.md's "Calibration" section for the
# full pipeline.
#
# RECALIBRATED (2026-10-04) for a SECOND, physically different Insta360 X3
# unit -- the values below replace a prior calibration done against the
# first unit. This second unit needed its own fix first: it did not
# override main.cc's requested LiveStreamParam.video_resolution the way
# the first unit did, so it was delivering a square single-lens
# RES_2880_2880P30 frame instead of the real 3840x1920 dual-fisheye one
# until main.cc was changed to request RES_3840_1920P30 explicitly (see
# that file's LiveStreamParam comment and README.md).
#
# Camera-only intrinsics (basalt_calibrate, kb4): two calibration sweeps
# were recorded; both gave consistent, good intrinsics (0.48px and 0.53px
# mean reprojection respectively, fx/fy/cx/cy/k1-k4 within ~0.3% of each
# other) -- intrinsics don't depend on rotational excitation, so this
# agreement is expected and the first sweep's slightly better 0.48px fit
# is used below. Re-verified this fit's equidistant model stays
# monotonically increasing over the FULL theta in [0, 90deg] range (unlike
# the first unit's fits, which were only valid to ~103-120deg out of a
# possible larger range) -- main.cc's kMaskRadiusPx did not need any
# change for this.
#
# Camera-IMU extrinsic (basalt_calibrate_imu): IMU.T_b_c1 is phase 1's
# result (extrinsics + bias + gravity only, accel/gyro scale held at
# identity), same reasoning as before -- with --no-gui, calibrate_imu.cpp
# unconditionally runs a second phase (setOptImuScale(true)) that, on
# every sweep tried for the first unit AND both sweeps tried for this
# second unit, either collapsed to a degenerate near-zero/wrong-gravity
# scale or diverged outright (accel_bias in the thousands, gravity norm
# in the thousands) -- so phase 1's result, extracted by hand from that
# phase's log output, remains the only usable one; calibrate_imu.cpp
# --no-gui only writes calibration.json after all phases (incl. the
# broken ones) complete. Two sweeps were tried for this second unit: the
# first (145s, 4367 frames, moderate rotation) gave phase 1 gravity norm
# 10.15 m/s^2 (3.5% off real 9.81) with 15.0px mean reprojection; a
# second, longer sweep (243s, 7290 frames) with MORE deliberate/faster
# 3-axis rotation -- intended to improve on that -- instead diverged
# outright during phase 1 itself (reprojection climbed past 90px, gravity
# norm into the thousands) and was abandoned; the first sweep's milder
# result is used below. 15.0px reprojection is noticeably worse than the
# 0.66px achieved for the first unit's T_b_c1 -- treat this extrinsic as
# a usable-but-rougher first pass, and re-attempt with a fresh sweep
# (varied but not overly fast/jerky rotation, across the whole frame) if
# tracking quality with this unit suffers from it.
#
# IMU noise parameters below are UNCHANGED from the first unit's real
# Allan-deviation measurements (see their own comment) -- not re-measured
# against this second unit's actual IMU, just carried over as a
# reasonable same-model approximation. IMU.Frequency is likewise still
# the first unit's measured rate; re-measure both if this unit's IMU
# characteristics turn out to differ meaningfully.
#
# Structure confirmed against ORB-SLAM3's own
# Examples/Monocular-Inertial/TUM-VI.yaml (a real fisheye + IMU example, same
# KannalaBrandt8 camera model this file uses) and RealSense_D435i.yaml (the
# live-camera IMU.T_b_c1/noise field names).

#--------------------------------------------------------------------------------------------
# Camera Parameters. Adjust them!
#--------------------------------------------------------------------------------------------
File.version: "1.0"

# Verified against real hardware: Sphere (360) capture mode -- required for
# IMU delivery -- delivers raw dual-fisheye (two side-by-side circular
# fisheye images, one per lens), not a stitched equirectangular panorama.
# main.cc crops to the front lens's circle only (left half, square), so this
# genuinely is a single fisheye lens image and the Kannala-Brandt model
# applies directly.
Camera.type: "KannalaBrandt8"

# Historical note: an earlier cv2.fisheye.calibrate fit of the BACK lens
# (24 images, 9x6 checkerboard, 26.6px RMS) was superseded by the Basalt fit
# below. The OpenCV tooling is still in calibration/ as a fallback.
#
# Basalt KannalaBrandt8 (kb4) camera-only intrinsics for the SECOND
# Insta360 X3 unit (see file header), from the first of two calibration
# sweeps at the 1920->800 crop/resolution (full lens circle, no margin
# trim -- see main.cc's kBoundingBoxOrigin/kSlamFrameSize comment for
# why). Reprojection error 0.48px. This fit's equidistant range is
# monotonic (physically valid) over the full theta in [0, 90deg] --
# main.cc's kMaskRadiusPx (385px, see that constant's own comment) stays
# well within that, no change needed.
#
# Supersedes a DIFFERENT, now-stale AprilGrid fit (fx=214.09, fy=214.13,
# cx=396.53, cy=399.53, 0.50px reprojection, theta<=103.08deg monotonic
# range) that briefly existed on a sibling branch
# (feat/insta360-docker-slam-fixes, 2026-09-21) against the FIRST physical
# unit, before this second-unit recalibration (2026-10-04, see file
# header) landed on master -- chronologically newer, so kept here over
# that branch's numbers when merging its other (non-calibration) fixes in.
# That branch's real insight about kMaskRadiusPx being overly conservative
# relative to the monotonic range is preserved in main.cc's own comment,
# recomputed against THIS fit's coefficients rather than the stale ones.
Camera1.fx: 215.0920
Camera1.fy: 215.3090
Camera1.cx: 400.4080
Camera1.cy: 397.5860

# Kannala-Brandt equidistant distortion coefficients from the same
# calibration.
Camera1.k1: 0.0885139
Camera1.k2: -0.0344811
Camera1.k3: 0.0145533
Camera1.k4: -0.00349882

# Camera resolution -- must match main.cc's slam_frame pipeline: full
# 1920x1920 lens circle (no crop/margin trim), resized to 800x800.
Camera.width: 800
Camera.height: 800

Camera.fps: 30

# Color order of the images (0: BGR, 1: RGB). main.cc converts to RGB before
# broadcasting to Python but feeds SLAM the original BGR decode -- if that
# changes, update this too.
Camera.RGB: 0

# Real camera-to-IMU extrinsic for the SECOND Insta360 X3 unit (see file
# header), from Basalt's basalt_calibrate_imu, phase-1 result (see the
# file-header comment above for why phase 1 rather than the final saved
# output, and for this result's rougher 15.0px reprojection vs the first
# unit's 0.66px). Translation is in meters; ~24.4cm/-8.1cm/0.4cm offset
# between the camera lens and the IMU package -- a plausible order of
# magnitude for this rig's physical layout, though the first unit's
# translation was quite different (~16.5/12.8/-2.2cm), consistent with
# these being two separate physical units with different IMU-package
# placement, not a sign of error.
IMU.T_b_c1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [-0.071596,   0.997088,   0.0262729,  0.244089,
          -0.00591342, -0.0267643, 0.999624,  -0.08057,
           0.997416,   0.0714138,  0.00781242, 0.00423873,
           0.0,         0.0,       0.0,        1.0]

# Real IMU noise parameters, measured via Allan deviation (allantools
# oadev, data_type="freq") on a 213s stationary recording (camera on a
# still surface, --no-slam --record) of the actual Insta360 X3 IMU --
# replaces the generic VINS-Mono placeholder defaults. NoiseGyro/NoiseAcc
# (white noise / angle-velocity random walk) are solid AS A STATIONARY
# measurement: the Allan deviation log-log slope came out within ~2% of
# the theoretical -0.5 across all 3 axes of both sensors. GyroWalk/AccWalk
# (bias random walk) are much less certain even stationary -- a proper
# random-walk region needs a much longer stationary recording (tens of
# minutes to hours) to show its characteristic +0.5 slope; at 213s the fit
# found slopes nowhere near +0.5, so these two were already a rough
# approximation, not a confident measurement.
#
# All four values below are inflated (Noise x5, Walk x8) beyond the raw
# stationary measurement: a handheld/teleop rig undergoes real vibration
# and motion-induced sensor noise that a still-surface recording can't
# capture, and ORB-SLAM3's inertial optimizer (EdgeInertial/EdgeInertialGS
# in G2oTypes.cc) trusts IMU residuals in inverse proportion to these
# values -- too-tight noise estimates make it overconfident in a noisier-
# than-modeled signal, which was confirmed via gdb on real hardware to let
# a Levenberg-Marquardt bias-vertex update run away far enough to break
# IMU::Preintegrated::GetDeltaRotation's first-order bias-correction
# linearization (crashed as "Sophus SO3::exp failed! omega: nan nan nan"
# in EdgeInertialGS::computeError / PoseInertialOptimizationLastFrame)
# during aggressive real-hardware motion testing. This is a real fix to
# how the optimizer uses IMU data (trusting it exactly as much as it
# actually deserves under real usage), not a crash guard. Re-tune (or
# record a stationary-vs-dynamic comparison and derive a principled
# inflation factor) if tracking accuracy suffers from being too
# conservative. Values below are the max across x/y/z (conservative).
# IMU.Frequency is the real measured rate.
IMU.InsertKFsWhenLost: 0
IMU.NoiseGyro: 8.429130e-04   # rad/s/sqrt(Hz) (5x stationary measurement)
IMU.NoiseAcc: 2.011808e-02    # m/s^2/sqrt(Hz) (5x stationary measurement)
IMU.GyroWalk: 6.339842e-04    # rad/s^2/sqrt(Hz) (8x stationary measurement, already rough -- see comment above)
IMU.AccWalk: 7.626927e-03     # m/s^3/sqrt(Hz) (8x stationary measurement, already rough -- see comment above)
IMU.Frequency: 500.0  # measured on firmware v1.1.6 -- see note below
# IMU.Frequency was 318.7, measured on firmware v1.0.83. Re-measured on
# firmware v1.1.6 (X3, serial IAQEB2606EEWG9) from a 20.5s --record capture:
# 10450 gyro + 10450 accel samples over 20.80s = 502.4 Hz by count/span, with
# mean inter-sample dt of exactly 2.000 ms => a steady 500 Hz. This is a real
# firmware difference, not noise (dt median 2.039 ms, p95 2.306, max 2.571).
#
# This matters more than it looks. ORB-SLAM3 does, in Tracking.cc:
#     const float sf = sqrt(mImuFreq);
#     mpImuCalib = new IMU::Calib(Tbc, Ng*sf, Na*sf, Ngw/sf, Naw/sf);
# so the four noise values above are scaled by sqrt(frequency) (walks are
# divided by it). At 318.7 instead of 500 every term was off by
# sqrt(500/318.7) = 1.26x: white noise under-scaled (over-trusting the IMU)
# and bias walk over-scaled.
#
# CAVEAT for re-tuning: the x5/x8 inflation above was chosen WITH the wrong
# 318.7 in place. Correcting to 500 raises effective white noise by 1.26x
# (safer w.r.t. the LM bias runaway documented above) but lowers effective
# bias walk by the same factor (less safe). If the "Sophus SO3::exp failed!"
# crash reappears, raise GyroWalk/AccWalk before touching anything else.

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------
# Tried reducing to 800/6 levels to ease per-frame ORB extraction cost
# (hoping to reduce brief motion-triggered freezes) -- verified against
# real hardware that this instead broke initialization entirely (0 OK
# poses in a 30s test, vs ~80% success at these original values), almost
# certainly by pushing detected keypoint counts below ORB_SLAM3's ~100
# threshold within the already-small masked circular region. Reverted.
#
# Increased nFeatures 1250->2000 to reduce "Fail to track local map!"
# resets (the dominant reset cause in real live testing -- 7 of 10 in one
# session): more candidate features directly means more robust matching
# against the local map. Feasible now specifically because main.cc's SLAM
# thread is gyro-batch-driven (~10Hz effective processing, see its
# comment) rather than the old ~30fps frame-driven trigger, leaving much
# more CPU headroom per processed frame than when 1250 was originally
# tuned. Revert toward 1250 if this reintroduces the freezing the 800/6
# attempt above was trying to avoid.
ORBextractor.nFeatures: 2000
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

#--------------------------------------------------------------------------------------------
# Viewer Parameters (only used when insta360_bridge is run with --viewer)
#--------------------------------------------------------------------------------------------
# Scales the "Current Frame" display window relative to the native
# 800x800 SLAM frame (see main.cc's kSlamFrameSize) -- display-only, does
# not affect tracking resolution/quality. 800 is already a reasonable size.
Viewer.imageViewScale: 1.0

Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -3.5
Viewer.ViewpointF: 500.0
