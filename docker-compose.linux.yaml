# Native Linux host compose file: run `docker compose -f docker-compose.linux.yaml up -d`
# (or `run --rm robo_manip_baselines bash` for an interactive shell).
#
# Prerequisites on the Linux host:
#   1. NVIDIA Container Toolkit installed and configured for Docker:
#        sudo nvidia-ctk runtime configure --runtime=docker
#        sudo systemctl restart docker
#      (unlike Docker Desktop on Windows, native Linux Docker has no built-in
#      GPU passthrough -- this is what makes the `deploy.resources` block
#      below actually reach the host GPUs).
#   2. Grant the container access to your X server once per session:
#        xhost +local:docker
#      DISPLAY is passed through from the host shell (not baked into the
#      image like the Windows build's host.docker.internal:0.0), and the
#      host's X11 socket is bind-mounted below.
#
# GPU note: build.args below pins torch==2.5.1/torchvision==0.20.1/
# torchcodec==0.1.1 from the cu121 wheel index, instead of the Windows
# build's default torch==2.10.0/cu128. This is for hosts (like this one)
# whose driver is too old for CUDA 12.6+: CUDA's forward-compatibility
# package -- which is what would otherwise let a newer CUDA build run on an
# older driver -- only supports data-center GPUs, so on a consumer/
# workstation card (e.g. TITAN RTX) a cu128 build fails outright with
# "CUDA driver version is insufficient" / "forward compatibility was
# attempted on non supported HW", not just a slower fallback path. cu121 is
# the newest index that still natively matches driver branches around
# 530-535. This intentionally diverges from pyproject.toml's torch==2.10.0
# pin -- see the matching comment in Dockerfile for how that's kept from
# being silently overwritten by the ".[act]" install step. If you later
# update this host's NVIDIA driver to >=560 (cu126) or >=570 (cu128), drop
# the build.args override below to go back to the Windows build's versions.
#
# USB devices (SpaceMouse, GELLO, Femto Bolt/RealSense cameras, real robot
# controllers) can be bound directly on native Linux -- no WSL-style
# passthrough workaround needed. Uncomment and adjust the `devices:` block
# below to match the device's /dev path, and make sure your user is in the
# `dialout` group (or the device node's owning group) for serial access.

services:
  robo_manip_baselines:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu121
        TORCH_VERSION: 2.5.1
        TORCHVISION_VERSION: 0.20.1
        TORCHCODEC_VERSION: 0.1.1
    image: robo_manip_baselines:latest
    container_name: robo_manip_baselines
    stdin_open: true
    tty: true
    working_dir: /workspace/RoboManipBaselines/robo_manip_baselines
    environment:
      - DISPLAY=${DISPLAY}
    volumes:
      - .:/workspace/RoboManipBaselines
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0
