# Native Linux host compose file: run `docker compose -f docker-compose.linux.yaml up -d`
# (or `run --rm robo_manip_baselines bash` for an interactive shell).
#
# Prerequisites on the Linux host:
#   1. NVIDIA Container Toolkit installed and configured for Docker:
#        sudo nvidia-ctk runtime configure --runtime=docker
#        sudo systemctl restart docker
#      (unlike Docker Desktop on Windows, native Linux Docker has no built-in
#      GPU passthrough -- this is what makes the `deploy.resources` block
#      below actually reach the host GPUs).
#   2. Grant the container access to your X server once per session:
#        xhost +local:docker
#      DISPLAY is passed through from the host shell (not baked into the
#      image like the Windows build's host.docker.internal:0.0), and the
#      host's X11 socket is bind-mounted below.
#
# GPU note: this file previously carried a build.args block pinning
# CUDA_BASE_IMAGE to nvidia/cuda:12.2.2 and torch down to 2.5.1/cu121, for a
# host whose driver was too old for CUDA 12.6+ (a TITAN RTX). That override has
# been removed: this host runs an RTX 4090 Laptop on driver 595.91.07 / CUDA
# 13.2, which satisfies the default base image's baked
# NVIDIA_REQUIRE_CUDA=cuda>=12.4 natively, so the forward-compatibility trap
# (which only supports data-center GPUs and fails outright on consumer cards)
# cannot trigger. The build now uses the Dockerfile defaults:
# nvidia/cuda:12.4.1-devel-ubuntu22.04 + torch 2.10.0/cu128.
#
# If this file is ever used on a host with a driver older than ~570, restore
# the override -- see the Dockerfile's own comments for how pyproject.toml's
# torch==2.10.0 pin is kept from silently undoing it.
#
# USB devices (SpaceMouse, GELLO, Femto Bolt/RealSense cameras, real robot
# controllers) can be bound directly on native Linux -- no WSL-style
# passthrough workaround needed. Uncomment and adjust the `devices:` block
# below to match the device's /dev path, and make sure your user is in the
# `dialout` group (or the device node's owning group) for serial access.

services:
  robo_manip_baselines:
    build:
      context: .
      dockerfile: Dockerfile
    image: robo_manip_baselines:latest
    container_name: robo_manip_baselines
    stdin_open: true
    tty: true
    # Docker's default /dev/shm is 64MB, which training cannot work with:
    # a DataLoader with num_workers>0 hands every batch to the main process
    # through shared memory, and one image batch alone is far bigger than
    # that -- 64 (batch) x 2 (obs steps) x 3ch x 240x320 x 4B = 118MB, and
    # prefetch_factor=4 across 4 workers keeps up to ~1.9GB in flight. Below
    # this, training dies on the first batch with
    #   RuntimeError: unable to allocate shared memory (shm) for file ...
    # The workaround is --num_workers 0 (single-process loading, no shm at
    # all), but that serializes data loading and measurably slows training,
    # so give the container room instead.
    shm_size: '16gb'
    working_dir: /workspace/RoboManipBaselines/robo_manip_baselines
    environment:
      - DISPLAY=${DISPLAY}
    volumes:
      - .:/workspace/RoboManipBaselines
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Rendezvous for the insta360_bridge Unix socket, so teleop running in
      # this container can reach a bridge running in the insta360 container.
      # See docker-compose.insta360.yaml.
      - /tmp/insta360:/tmp/insta360:rw
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0
